name: Aplicar headers Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/apply-cloudflare-security.py
      - cloudflare-worker.js
      - _headers
      - js/crptochat.js

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar Page Shield + Transform Rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/apply-cloudflare-security.py
